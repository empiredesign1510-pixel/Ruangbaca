<style>
:root{--bg:#111411;--panel:#191d19;--panel2:#20251f;--line:rgba(255,255,255,.10);--text:#f4efe4;--muted:#9ca497;--paper:#f8f3e9;--wine:#a94c55;--gold:#d8a55d;--serif:"Newsreader",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--text);font-family:var(--sans)}button,input{font:inherit}.app{height:100%;width:100vw;max-width:100%;overflow:hidden;display:grid;grid-template-columns:292px minmax(0,1fr)}.sidebar{min-width:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}.brand{height:76px;padding:0 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);font:650 21px var(--serif)}.brand-icon{width:32px;height:36px;border:1.5px solid var(--gold);border-radius:3px 7px 7px 3px;position:relative;box-shadow:inset 5px 0 rgba(216,165,93,.15)}.brand-icon:after{content:"";position:absolute;width:10px;height:22px;right:5px;top:4px;border:1px solid var(--gold);border-top:0;border-radius:0 0 6px 6px}.side-scroll{padding:22px 16px;overflow:auto}.side-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 8px 12px}.book-list{display:grid;gap:7px}.book-item{width:100%;border:1px solid transparent;background:transparent;color:inherit;text-align:left;border-radius:13px;padding:9px;display:grid;grid-template-columns:42px 1fr;gap:12px;cursor:pointer}.book-item:hover{background:rgba(255,255,255,.04)}.book-item.active{background:var(--panel2);border-color:var(--line)}.mini-cover{width:42px;height:57px;border-radius:2px 6px 6px 2px;background:var(--c,#415448);box-shadow:-3px 4px 8px rgba(0,0,0,.25)}.book-item strong{display:block;font:600 14px/1.25 var(--serif);margin:5px 0 2px}.book-item span{font-size:10px;color:var(--muted)}.book-item.soon{opacity:.55;cursor:default}.side-actions{margin-top:auto;padding:16px;border-top:1px solid var(--line);display:grid;gap:9px}.btn{height:44px;padding:0 15px;border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--text);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:rgba(255,255,255,.06)}.btn.primary{background:var(--text);color:#171a16;border-color:var(--text)}.btn:disabled{opacity:.45;cursor:not-allowed}.file-input{display:none}.workspace{width:100%;min-width:0;overflow:hidden;display:grid;grid-template-rows:76px minmax(0,1fr) 72px}.topbar{min-width:0;display:flex;align-items:center;gap:15px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(17,20,17,.9);backdrop-filter:blur(12px);z-index:4}.menu-btn{display:none}.book-heading{min-width:0;margin-right:auto}.book-heading strong{display:block;font:600 17px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book-heading span{font-size:11px;color:var(--muted)}.tool-btn{height:42px;min-width:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);cursor:pointer}.tool-btn:hover{background:rgba(255,255,255,.06)}.stage{position:relative;width:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:26px 82px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#343c31 0,#20251f 43%,#111411 78%)}.stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(to bottom,black,transparent 70%)}.book-shadow{position:absolute;width:min(900px,72vw);height:60px;bottom:5%;border-radius:50%;background:rgba(0,0,0,.48);filter:blur(26px)}.spread{position:relative;z-index:2;width:100%;max-width:970px;min-width:0;height:min(72vh,720px);display:flex;perspective:1800px;filter:drop-shadow(0 30px 32px rgba(0,0,0,.42));touch-action:pan-y}.page{width:50%;height:100%;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.page.left{border-radius:9px 0 0 9px;background:linear-gradient(90deg,#faf6ed 0,#faf6ed 92%,#ddd5c8 100%)}.page.right{border-radius:0 9px 9px 0;background:linear-gradient(90deg,#ddd5c8 0,#faf6ed 8%,#faf6ed 100%)}.page canvas{display:block;max-width:100%;max-height:100%}.page-no{position:absolute;bottom:14px;color:#8c8072;font-size:10px}.empty-page{background:#eae3d7}.loader{position:absolute;z-index:4;display:grid;place-items:center;gap:12px;color:var(--muted);font-size:13px}.spinner{width:30px;height:30px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.nav-btn{position:absolute;z-index:4;top:50%;width:50px;height:50px;margin-top:-25px;border:1px solid var(--line);border-radius:50%;background:rgba(18,21,17,.78);color:var(--text);font-size:26px;cursor:pointer;backdrop-filter:blur(10px)}.nav-btn:hover{background:var(--wine)}.nav-btn:disabled{opacity:.25}.nav-btn.prev{left:20px}.nav-btn.next{right:20px}.bottom{display:flex;align-items:center;justify-content:center;gap:16px;padding:0 20px;border-top:1px solid var(--line);background:var(--panel)}.bottom span{font-size:11px;color:var(--muted);min-width:110px;text-align:center}.bottom input[type=range]{width:min(390px,40vw);accent-color:var(--gold)}.turn-next{animation:turnNext .25s ease}.turn-prev{animation:turnPrev .25s ease}@keyframes turnNext{50%{transform:translateX(-12px) rotateY(-5deg);opacity:.74}}@keyframes turnPrev{50%{transform:translateX(12px) rotateY(5deg);opacity:.74}}.toast{position:fixed;left:50%;bottom:88px;z-index:20;transform:translate(-50%,20px);padding:11px 15px;border:1px solid var(--line);border-radius:10px;background:#282e27;color:var(--text);font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none;position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.58);backdrop-filter:blur(2px)}.drive-status{margin:8px;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:11px;line-height:1.5}.brand-close{display:none;margin-left:auto}.book-item .book-copy{min-width:0}.book-item strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.sidebar{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);height:100dvh;transform:translateX(-105%);transition:.25s;box-shadow:25px 0 70px rgba(0,0,0,.5);z-index:6}.sidebar.show{transform:none}.sidebar.show~.scrim{display:block}.brand-close{display:grid;place-items:center}.menu-btn{display:block}.stage{padding:22px 58px}.spread{width:100%;max-width:780px}}
@media(max-width:650px){.workspace{width:100vw;max-width:100%;grid-template-rows:64px minmax(0,1fr) calc(58px + env(safe-area-inset-bottom))}.topbar{width:100%;min-width:0;padding:0 10px;gap:9px}.menu-btn{flex:0 0 44px}.book-heading{width:0;flex:1 1 auto}.book-heading strong{font-size:15px}.book-heading span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar .hide-mobile{display:none}.tool-btn{min-width:42px;padding:0}.stage{width:100%;min-width:0;padding:12px 48px}.spread{width:100%;max-width:calc(100vw - 96px);min-width:0;height:calc(100dvh - 146px);max-height:720px}.page{flex:0 0 100%;width:100%;min-width:0}.page.right{display:none}.page.left{border-radius:7px;background:#faf6ed}.page canvas{max-width:100%!important;max-height:100%!important}.nav-btn{width:42px;height:42px;margin-top:-21px}.nav-btn.prev{left:3px}.nav-btn.next{right:3px}.bottom{width:100%;min-width:0;gap:8px;padding:0 10px env(safe-area-inset-bottom)}.bottom span{min-width:96px}.bottom input[type=range]{min-width:0;width:auto;flex:1}.bottom span:last-child{display:none}.toast{max-width:calc(100vw - 32px);width:max-content;bottom:calc(72px + env(safe-area-inset-bottom));text-align:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-icon"></span>RuangBaca<button class="tool-btn brand-close" id="sidebarClose" aria-label="Tutup koleksi">×</button></div><div class="side-scroll"><p class="side-label">Perpustakaan saya</p><div class="book-list" id="bookList"><button class="book-item active" id="demoBookBtn"><span class="mini-cover" style="--c:#26372e"></span><span class="book-copy"><strong>Membaca Seperti Buku</strong><span>PDF demo · 8 halaman</span></span></button><div class="drive-status" id="driveStatus">Koleksi Google Drive belum disinkronkan.</div></div></div><div class="side-actions"><label class="btn primary" for="pdfFile">＋ Buka PDF sendiri</label><input class="file-input" id="pdfFile" type="file" accept="application/pdf"><button class="btn" id="connectBtn">Sinkronkan Google Drive</button></div></aside><button class="scrim" id="scrim" aria-label="Tutup koleksi"></button>
<section class="workspace"><header class="topbar"><button class="tool-btn menu-btn" id="menuBtn" aria-label="Buka koleksi">☰</button><div class="book-heading"><strong id="bookTitle">Membaca Seperti Buku</strong><span id="bookMeta">RuangBaca · PDF langsung di website</span></div><button class="tool-btn hide-mobile" id="zoomOut" aria-label="Perkecil">−</button><button class="tool-btn hide-mobile" id="zoomIn" aria-label="Perbesar">＋</button><button class="tool-btn" id="fullscreen" aria-label="Layar penuh">⛶</button></header>
<main class="stage" id="stage"><div class="book-shadow"></div><button class="nav-btn prev" id="prev" aria-label="Halaman sebelumnya">‹</button><div class="spread" id="spread"><div class="loader" id="loader"><span class="spinner"></span><span>Menyiapkan buku…</span></div></div><button class="nav-btn next" id="next" aria-label="Halaman berikutnya">›</button></main>
<footer class="bottom"><span id="pageInfo">Halaman —</span><input id="pageRange" type="range" min="1" max="1" value="1" aria-label="Pilih halaman"><span>Geser atau tekan ← →</span></footer></section></div><div class="toast" id="toast"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);let pdf=null,page=1,zoom=1,swipeX=0,renderToken=0;const spread=$('#spread');
const isMobile=()=>matchMedia('(max-width:650px)').matches;const step=()=>isMobile()?1:2;const total=()=>pdf?.numPages||1;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)}
async function loadPdf(source,title='Membaca Seperti Buku'){spread.innerHTML='<div class="loader"><span class="spinner"></span><span>Menyiapkan buku…</span></div>';try{const input=typeof source==='string'?{url:source,rangeChunkSize:1048576}:source;pdf=await pdfjsLib.getDocument(input).promise;page=1;zoom=1;$('#bookTitle').textContent=title;$('#bookMeta').textContent=`RuangBaca · ${pdf.numPages} halaman · terbaca langsung`;$('#pageRange').max=pdf.numPages;await renderSpread()}catch(err){console.error(err);spread.innerHTML=`<div class="loader"><strong>PDF belum dapat dibuka</strong><span>${String(err.message||err)}</span></div>`}}
async function renderPage(n,side,token){const holder=document.createElement('div');holder.className=`page ${side}`;spread.append(holder);if(n>total()){holder.classList.add('empty-page');return}const p=await pdf.getPage(n);if(token!==renderToken)return;const base=p.getViewport({scale:1});const w=Math.max(220,holder.clientWidth-8),h=Math.max(320,holder.clientHeight-8);const fit=Math.min(w/base.width,h/base.height)*zoom;const output=Math.min(devicePixelRatio||1,2);const viewport=p.getViewport({scale:fit*output});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);canvas.style.width=`${viewport.width/output}px`;canvas.style.height=`${viewport.height/output}px`;holder.append(canvas);const folio=document.createElement('span');folio.className='page-no';folio.textContent=n;holder.append(folio);await p.render({canvasContext:canvas.getContext('2d'),viewport}).promise}
async function renderSpread(dir=''){if(!pdf)return;const token=++renderToken;page=Math.max(1,Math.min(page,total()));spread.className=`spread ${dir==='next'?'turn-next':dir==='prev'?'turn-prev':''}`;spread.innerHTML='';const jobs=[renderPage(page,'left',token)];if(step()===2)jobs.push(renderPage(page+1,'right',token));await Promise.all(jobs);if(token!==renderToken)return;const end=Math.min(total(),page+step()-1);$('#pageInfo').textContent=end===page?`Halaman ${page} / ${total()}`:`Halaman ${page}–${end} / ${total()}`;$('#pageRange').value=page;$('#prev').disabled=page<=1;$('#next').disabled=end>=total()}
function turn(dir){const n=page+(dir==='next'?step():-step());if(n<1||n>total())return;page=n;renderSpread(dir)}
$('#next').onclick=()=>turn('next');$('#prev').onclick=()=>turn('prev');$('#pageRange').oninput=e=>{page=Number(e.target.value);renderSpread()};
$('#zoomIn').onclick=()=>{zoom=Math.min(1.6,zoom+.1);renderSpread();toast(`Zoom ${Math.round(zoom*100)}%`)};$('#zoomOut').onclick=()=>{zoom=Math.max(.7,zoom-.1);renderSpread();toast(`Zoom ${Math.round(zoom*100)}%`)};
$('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
function closeSidebar(){$('#sidebar').classList.remove('show')}
function setActiveBook(button){document.querySelectorAll('.book-item').forEach(x=>x.classList.remove('active'));button?.classList.add('active')}
function addDriveBooks(books){document.querySelectorAll('[data-drive-book]').forEach(x=>x.remove());const status=$('#driveStatus');status.textContent=books.length?`${books.length} PDF ditemukan di Google Drive.`:'Folder terhubung, tetapi belum ada PDF yang dapat dibaca.';for(const [i,book] of books.entries()){const btn=document.createElement('button');btn.className='book-item';btn.dataset.driveBook=book.id;const cover=document.createElement('span');cover.className='mini-cover';cover.style.setProperty('--c',['#81404a','#a77944','#40566b','#66507a'][i%4]);const copy=document.createElement('span');copy.className='book-copy';const title=document.createElement('strong');title.textContent=book.title||book.name||'Tanpa judul';const meta=document.createElement('span');meta.textContent=[book.category,book.sizeLabel].filter(Boolean).join(' · ')||'PDF Google Drive';copy.append(title,meta);btn.append(cover,copy);btn.onclick=()=>{setActiveBook(btn);loadPdf(book.pdfUrl,title.textContent);closeSidebar()};$('#bookList').insertBefore(btn,status)}}
async function syncDrive(silent=false){const btn=$('#connectBtn'),status=$('#driveStatus');btn.disabled=true;btn.textContent='Menyinkronkan…';status.textContent='Membaca folder dan shortcut Google Drive…';try{const response=await fetch('/api/catalog',{headers:{Accept:'application/json'}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`API katalog gagal (${response.status})`);const books=Array.isArray(data.books)?data.books:[];addDriveBooks(books);btn.textContent='Sinkronkan ulang Drive';if(!silent)toast(`${books.length} PDF berhasil dimuat`)}catch(err){console.error(err);status.textContent=`Drive belum terhubung: ${err.message}`;btn.textContent='Coba hubungkan lagi';if(!silent)toast('Google Drive belum terhubung. Periksa konfigurasi Vercel.')}finally{btn.disabled=false}}
$('#pdfFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const data=new Uint8Array(await f.arrayBuffer());setActiveBook(null);loadPdf({data},f.name.replace(/\.pdf$/i,'').replaceAll('_',' '));closeSidebar()};
$('#demoBookBtn').onclick=()=>{setActiveBook($('#demoBookBtn'));loadPdf({data:demoPdfData()},'Membaca Seperti Buku');closeSidebar()};
$('#connectBtn').onclick=()=>syncDrive(false);$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('show');$('#sidebarClose').onclick=closeSidebar;$('#scrim').onclick=closeSidebar;
spread.addEventListener('pointerdown',e=>swipeX=e.clientX);spread.addEventListener('pointerup',e=>{const dx=e.clientX-swipeX;if(Math.abs(dx)>55)turn(dx<0?'next':'prev')});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn('next');if(e.key==='ArrowLeft')turn('prev');if(e.key==='Escape')$('#sidebar').classList.remove('show')});
